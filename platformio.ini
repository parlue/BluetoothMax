; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

; This is the actively-developed, multi-board-capable gateway (main.cpp and
; friends). gateway_millennium_only.cpp is excluded here -- it belongs only
; to the frozen esp32-c3-superminiv2 environment below.
build_src_filter =
    +<*>
    -<gateway_millennium_only.cpp>

; ChessLink Magic Board protocol: 38400 baud, 7 data bits, odd parity, 1 stop.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MILLENNIUM_BAUD=38400UL

; NimBLE-Arduino replaces the classic BLEDevice.h client stack here -- the
; classic library's connect() has no internal timeout and was found to hang
; forever against some non-Millennium boards even when the peer accepted the
; radio-level connection. NimBLE has a real, bounded connect timeout and is
; the same library already proven reliable in this user's CynusLink project.
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.0

; Frozen fallback: builds ONLY gateway_millennium_only.cpp, a snapshot of the
; proven single-board (Millennium/ChessLink-only) gateway taken right before
; the multi-board (Chessnut and beyond) rework began. Flash this if the
; actively-developed esp32-c3-supermini environment ever regresses against
; the real King + real Millennium board -- this build is never touched by
; ongoing multi-board work. Deliberately kept on the classic BLEDevice.h
; library (no NimBLE lib_deps) -- untouched, independent of anything above.
[env:esp32-c3-superminiv2]
extends = env:esp32-c3-supermini
lib_deps =
build_src_filter =
    -<*>
    +<gateway_millennium_only.cpp>
