; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200

; ChessLink Magic Board protocol: 38400 baud, 7 data bits, odd parity, 1 stop.
; RELAY_L_FRAME_TO_BOARD=1 is TEMPORARY here, for visually checking the real
; board's LEDs during the current rewiring test -- normally left at the
; default 0 (see receiveFromMillenniumComputer) since relaying King's L frame
; re-lights the board right after we clear it, which blocked King's reaction
; in earlier testing. Revert to 0 once LED debugging is done.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D MILLENNIUM_BAUD=38400UL
    -D RELAY_L_FRAME_TO_BOARD=1

; Diagnostic build: King's cable stays on this gateway, but the BLE scan
; should be pointed at DiablilloSniffer instead of the real board (real
; board powered off/out of range) to isolate whether our own cable-facing
; code is the reason King never reacts. RELAY_L_FRAME_TO_BOARD=1 restores
; forwarding King's 'L' frame to the BLE peer -- normally suppressed against
; the real board (it re-lights the board's physical LEDs and blocks King),
; but the sniffer needs to see it to decode and confirm King's suggested
; move, exactly like the original sniffer breakthrough via Diablillo.
[env:esp32-c3-supermini-sniffer-isolation]
extends = env:esp32-c3-supermini
build_flags =
    ${env:esp32-c3-supermini.build_flags}
    -D RELAY_L_FRAME_TO_BOARD=1
